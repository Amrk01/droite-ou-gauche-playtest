<style>

html, body { margin:0; background:var(--fond); color:var(--texte); font-family:'Inter',system-ui,sans-serif; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; }

button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--ligne); background:var(--carte); color:var(--encre); font-weight:600; padding:10px 14px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline:3px solid var(--rose); outline-offset:2px; }
button:disabled { opacity:.45; cursor:default; }
input, textarea { font:inherit; width:100%; padding:12px 14px; border:1px solid var(--ligne); border-radius:10px; background:var(--carte); color:var(--texte); }
.page { max-width:560px; margin:0 auto; padding:18px 18px 40px; }
.marque { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.marque b { font-family:'Epilogue',sans-serif; font-weight:800; font-size:1.05rem; color:var(--encre); letter-spacing:-.02em; }
.marque b i { font-style:normal; color:var(--rouge); }
.marque span { color:var(--sourd); font-size:.85rem; }
/* accueil */
.accueil h1 { font-size:clamp(1.7rem,7vw,2.3rem); line-height:1.02; margin:24px 0 12px; }
.accueil h1 em { font-style:italic; color:var(--rouge); }
.accueil p { margin:0 0 12px; }
.regles { list-style:none; padding:0; margin:14px 0 16px; display:grid; gap:8px; }
.regles li { display:grid; grid-template-columns:64px 1fr; gap:10px; align-items:center; font-size:.95rem; }
.pastille { font-family:'Epilogue',sans-serif; font-weight:800; font-size:.85rem; text-align:center; border-radius:999px; padding:5px 0; color:#fff; }
.p-oui { background:var(--vert); } .p-bof { background:var(--bleu); color:var(--marine); } .p-non { background:var(--rouge); }
.champ label { display:block; font-weight:600; margin:0 0 6px; color:var(--encre); }
.principal { background:var(--rouge); border-color:var(--rouge); color:#fff; width:100%; padding:14px; font-size:1.05rem; margin-top:12px; }
.petit { font-size:.85rem; color:var(--sourd); }
.encadre { border:1px solid var(--ligne); border-radius:14px; background:var(--carte); padding:14px 16px; margin:14px 0; font-size:.95rem; }
.encadre b { color:var(--encre); }
/* onglets des paquets */
.onglets { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:14px 0 0; }
.onglet { padding:9px 4px; font-family:'Epilogue',sans-serif; font-weight:800; font-size:.8rem; line-height:1.15; text-align:center; border-radius:10px; display:grid; gap:3px; }
.onglet small { display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:.7rem; color:var(--sourd); font-variant-numeric:tabular-nums; }
.onglet[aria-pressed="true"] { background:var(--marine); color:#fff; border-color:var(--marine); } .onglet[aria-pressed="true"] small { color:rgba(255,255,255,.75); }
.paquets { display:grid; gap:8px; margin:16px 0 4px; }
.paquet { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; text-align:left; padding:12px 14px; }
.paquet b { font-family:'Epilogue',sans-serif; font-weight:800; display:block; }
.paquet small { color:var(--sourd); font-size:.82rem; }
.paquet .avance { font-family:'Epilogue',sans-serif; font-weight:800; font-size:.8rem; border-radius:99px; padding:4px 10px; background:var(--ligne); color:var(--sourd); white-space:nowrap; }

.compte { font-variant-numeric:tabular-nums; font-size:.85rem; color:var(--sourd); white-space:nowrap; }
.lien { background:none; border:0; padding:6px 4px; color:var(--sourd); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
.jeu { margin:16px 0 14px; border-radius:20px; overflow:hidden; box-shadow:var(--ombre); }

.raccourcis { text-align:center; margin-top:6px; } @media (hover:none) { .raccourcis { display:none; } }
.statut { font-size:.8rem; color:var(--sourd); text-align:center; margin-top:10px; min-height:1.3em; }
.statut.ok { color:var(--vert); } .statut.err { color:var(--rouge); font-weight:600; }

.ligne { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; text-align:left; padding:10px 12px; font-weight:500; font-size:.92rem; }

.prop .deux { display:grid; gap:6px; }

.ok { color:var(--vert); font-weight:600; min-height:1.4em; }

.large { max-width:1100px; }
.cadre { overflow-x:auto; border:1px solid var(--ligne); border-radius:12px; background:var(--carte); margin-top:12px; }

.outils { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }

function marque(sous) { return '<div class="marque"><b>Finalisation des cartes <i>GOD</i></b><span>' + ech(sous) + '</span></div>'; }

/* ---------- enregistrement automatique (feuille Google via le script) ---------- */
var FILE = lire('god-vote:file') || [], envoiEnCours = false, minuterie = null, echecs = 0;
function enfiler(item) { item.ts = Date.now(); FILE.push(item); ecrire('god-vote:file', FILE); clearTimeout(minuterie); minuterie = setTimeout(vider, 1200); afficherStatut(); }
function vider() {
  if (envoiEnCours || !FILE.length || !CONFIG.endpoint) { afficherStatut(); return; }
  var lot = FILE.slice(0, 60); envoiEnCours = true; afficherStatut();
  fetch(CONFIG.endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(lot) })
    .then(function () { FILE = FILE.slice(lot.length); ecrire('god-vote:file', FILE); echecs = 0; var e = lire('god-vote:envoyes') || 0; ecrire('god-vote:envoyes', e + lot.length); })
    .catch(function () { echecs++; })
    .then(function () { envoiEnCours = false; afficherStatut(); if (FILE.length && echecs < 3) { minuterie = setTimeout(vider, echecs ? 8000 : 400); } });
}
function afficherStatut() {

  if (envoiEnCours) { z.className = 'statut'; z.textContent = 'Enregistrement…'; return; }
  if (FILE.length && echecs >= 3) { z.className = 'statut err'; z.textContent = FILE.length + ' vote' + (FILE.length > 1 ? 's' : '') + ' en attente (pas de réseau ?). Ils partiront dès que possible, ou envoie-les autrement à la fin.'; return; }
  if (FILE.length) { z.className = 'statut'; z.textContent = FILE.length + ' en attente d\'enregistrement…'; return; }
  z.className = 'statut ok'; z.textContent = n ? 'Tout est enregistré (' + n + ' envoi' + (n > 1 ? 's' : '') + ').' : 'Chaque vote s\'enregistre tout seul.';
}
window.addEventListener('online', function () { echecs = 0; vider(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { echecs = 0; vider(); } });

/* ---------- code de secours ---------- */
function b64u(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function flux(octets, F) { var f = new F('deflate-raw'), w = f.writable.getWriter(); w.write(octets); w.close(); return new Response(f.readable).arrayBuffer().then(function (b) { return new Uint8Array(b); }); }
function coder(d, s) {
  var dk = DECKS[d], k = '', r = {};
  dk.cartes.forEach(function (c, i) { var v = s.votes[c.id] || {}; k += CH[v.v || '']; if ((v.r || '').trim()) r[i] = v.r.trim(); });
  var octets = new TextEncoder().encode(JSON.stringify({ n: NOM, d: d, h: dk.h, t: Date.now(), k: k, r: r, p: (s.props || []).filter(function (p) { return (p.r || '').trim() || (p.v || '').trim(); }) }));
  if (!('CompressionStream' in window)) return Promise.resolve('GOD-VOTE.j.' + b64u(octets));
  return flux(octets, CompressionStream).then(function (z) { return 'GOD-VOTE.z.' + b64u(z); }).catch(function () { return 'GOD-VOTE.j.' + b64u(octets); });
}
function decoder(code) {
  var m = /^GOD-VOTE\.([zj])\.([A-Za-z0-9_-]+)$/.exec(code); if (!m) return Promise.reject(new Error('code illisible'));
  var octets = unb64u(m[2]);
  var p = m[1] === 'z' ? ('DecompressionStream' in window ? flux(octets, DecompressionStream) : Promise.reject(new Error('navigateur trop ancien pour lire ce code'))) : Promise.resolve(octets);
  return p.then(function (o) { return JSON.parse(new TextDecoder().decode(o)); });
}

function avancer(simple) {

document.addEventListener('keydown', function (e) {

/* ---------- dépouillement (pour Théophile) : index.html#depouillement ---------- */
function depouillement() {
  vue = 'depouillement'; var CLE = 'god-vote-depouillement', recus = lire(CLE) || { votes: {}, props: [] }, tri = 'score', d = ORDRE_DECKS[0];

    + '<details class="secours"><summary>Ajouter des messages reçus (codes de secours)</summary><textarea id="colle" style="min-height:80px" placeholder="Mes votes Gaucheoudroite, … : GOD-VOTE.z.…"></textarea><div class="outils"><button type="button" id="ajouter">Ajouter</button></div></details>'
    + '<div class="onglets" id="onglets-dep" style="max-width:560px"></div>'
    + '<h2 style="font-size:1.1rem;margin-top:22px">Les votants</h2><div class="cadre"><table id="votants"></table></div>'
    + '<h2 style="font-size:1.1rem;margin-top:22px">Les cartes</h2><div class="outils"><label class="petit">Trier par <select id="tri"><option value="score">score</option><option value="discorde">désaccord</option><option value="ordre">ordre du paquet</option></select></label><button type="button" id="tsv">Copier le tableau (feuille de calcul)</button><button type="button" id="claude">Copier pour Claude</button></div><div class="cadre"><table id="cartes"></table></div>'
    + '<h2 style="font-size:1.1rem;margin-top:22px">Les cartes proposées</h2><div class="cadre"><table id="props"></table></div>';
  function cleV(nom, dk, id) { return norm(nom) + '|' + dk + '|' + id; }
  function integrer(vs, ps) {
    // vs : lignes de la feuille [horodatage, prenom, paquet, id, recto, verso, vote, remarque, envoye_le] ; la plus récente gagne
    vs.forEach(function (l) { if (!l || !l[1]) return; var k = cleV(l[1], l[2], l[3]), t = l[8] ? Date.parse(l[8]) : Date.parse(l[0]); if (!recus.votes[k] || recus.votes[k].t <= t) recus.votes[k] = { n: String(l[1]), d: l[2], id: l[3], v: l[6], r: l[7] || '', t: t || 0 }; });

    integrer(data.votes.slice(1), (data.propositions || []).slice(1)); ok.textContent = (data.votes.length - 1) + ' lignes de votes lues.'; rendre();
  };
  page.querySelector('#charger').addEventListener('click', function () {
    var k = page.querySelector('#clef').value.trim(); ecrire('god-vote-clef', k); var ok = page.querySelector('#ok');
    if (!CONFIG.endpoint) { ok.textContent = 'Pas de script branché (config.json).'; return; }
    ok.textContent = 'Chargement…'; var s = document.createElement('script'); s.src = CONFIG.endpoint + (CONFIG.endpoint.indexOf('?') > 0 ? '&' : '?') + 'cle=' + encodeURIComponent(k) + '&callback=godRecu&t=' + Date.now(); s.onerror = function () { ok.textContent = 'Le script ne répond pas.'; }; document.body.appendChild(s);
  });
  page.querySelector('#ajouter').addEventListener('click', function () {
    var codes = page.querySelector('#colle').value.match(/GOD-VOTE\.[zj]\.[A-Za-z0-9_-]+/g) || [], ok = page.querySelector('#ok'); if (!codes.length) { ok.textContent = 'Aucun code trouvé dans ce texte.'; return; }
    Promise.all(codes.map(function (c) { return decoder(c).catch(function (e) { return { erreur: e.message }; }); })).then(function (ps) {
      var bons = 0, soucis = [];
      ps.forEach(function (p) {
        if (p.erreur) { soucis.push(p.erreur); return; } var dk = DECKS[p.d]; if (!dk || p.h !== dk.h) { soucis.push((p.n || '?') + ' : code d\'une autre version de la liste'); return; }
        dk.cartes.forEach(function (c, i) { var v = DE[p.k.charAt(i)]; if (!v) return; var k = cleV(p.n, p.d, c.id); if (!recus.votes[k] || recus.votes[k].t <= p.t) recus.votes[k] = { n: p.n, d: p.d, id: c.id, v: v, r: (p.r && p.r[i]) || '', t: p.t }; });
        (p.p || []).forEach(function (q, i) { var k = norm(p.n) + '|' + p.d + '|' + (i + 1); recus.props = recus.props.filter(function (x) { return x.k !== k; }); recus.props.push({ k: k, n: p.n, d: p.d, r: q.r || '', v: q.v || '' }); });
        bons++;
      });
      ecrire(CLE, recus); page.querySelector('#colle').value = ''; ok.textContent = bons + ' code' + (bons > 1 ? 's' : '') + ' ajouté' + (bons > 1 ? 's' : '') + (soucis.length ? ' ; ' + soucis.join(' ; ') : '') + '.'; rendre();
    });
  });
  function lignes() {
    var dk = DECKS[d], L = dk.cartes.map(function (c, i) { var o = { c: c, i: i, oui: 0, bof: 0, non: 0, rem: [] }; Object.keys(recus.votes).forEach(function (k) { var p = recus.votes[k]; if (p.d !== d || p.id !== c.id || !p.v) return; o[p.v] = (o[p.v] || 0) + 1; if (p.r) o.rem.push(p.n + ' : ' + p.r); }); o.n = o.oui + o.bof + o.non; o.score = o.n ? (o.oui - o.non) / o.n : 0; o.discorde = o.n ? Math.min(o.oui, o.non) / o.n : 0; return o; });
    if (tri === 'score') L.sort(function (a, b) { return b.score - a.score || b.oui - a.oui; }); if (tri === 'discorde') L.sort(function (a, b) { return b.discorde - a.discorde; });
    return L;
  }
  function rendre() {
    page.querySelector('#onglets-dep').innerHTML = ORDRE_DECKS.map(function (x) { return '<button type="button" class="onglet" data-d="' + x + '" aria-pressed="' + (x === d) + '">' + ech(DECKS[x].court) + '<small>' + DECKS[x].cartes.length + ' cartes</small></button>'; }).join('');

    var noms = Object.keys(parNom).sort(), N = DECKS[d].cartes.length;
    page.querySelector('#votants').innerHTML = '<tr><th>Prénom</th><th>Cartes votées</th><th>Dernier vote</th></tr>' + (noms.length ? noms.map(function (k) { var p = parNom[k]; return '<tr><td>' + ech(p.n) + '</td><td class="n">' + p.c + ' / ' + N + (p.c < N ? ' (incomplet)' : '') + '</td><td>' + (p.t ? new Date(p.t).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '') + '</td></tr>'; }).join('') : '<tr><td colspan="3" class="petit">Personne pour l\'instant sur ce paquet.</td></tr>');
    page.querySelector('#cartes').innerHTML = '<tr><th>Recto</th><th>Verso</th><th>Oui</th><th>Bof</th><th>Non</th><th>Score</th><th></th><th>Remarques</th></tr>' + lignes().map(function (o) { var t = o.n || 1; return '<tr><td>' + ech(o.c.r) + '</td><td>' + ech(o.c.v) + '</td><td class="n">' + o.oui + '</td><td class="n">' + o.bof + '</td><td class="n">' + o.non + '</td><td class="n">' + (o.n ? (o.score > 0 ? '+' : '') + o.score.toFixed(2).replace('.', ',') : '') + '</td><td><span class="jauge"><i style="width:' + 100 * o.oui / t + '%;background:var(--vert)"></i><i style="width:' + 100 * o.bof / t + '%;background:var(--bleu)"></i><i style="width:' + 100 * o.non / t + '%;background:var(--rouge)"></i></span></td><td>' + o.rem.map(ech).join('<br>') + '</td></tr>'; }).join('');
    var props = recus.props.filter(function (p) { return p.d === d; });
    page.querySelector('#props').innerHTML = '<tr><th>Prénom</th><th>Recto</th><th>Verso</th></tr>' + (props.length ? props.map(function (p) { return '<tr><td>' + ech(p.n) + '</td><td>' + ech(p.r) + '</td><td>' + ech(p.v) + '</td></tr>'; }).join('') : '<tr><td colspan="3" class="petit">Aucune proposition sur ce paquet.</td></tr>');
  }
  page.querySelector('#tri').addEventListener('change', function (e) { tri = e.target.value; rendre(); });
  function copie(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { page.querySelector('#ok').textContent = 'Copié.'; }).catch(function () { page.querySelector('#ok').textContent = 'Copie impossible ici.'; }); }
  page.querySelector('#tsv').addEventListener('click', function () { copie('Paquet\tRecto\tVerso\tOui\tBof\tNon\tScore\tRemarques\n' + lignes().map(function (o) { return [DECKS[d].court, o.c.r, o.c.v, o.oui, o.bof, o.non, o.n ? o.score.toFixed(2).replace('.', ',') : '', o.rem.join(' | ')].join('\t'); }).join('\n')); });
  page.querySelector('#claude').addEventListener('click', function () { copie('=== FINALISATION GOD · ' + d + ' · ' + DECKS[d].h + ' ===\n' + JSON.stringify({ votes: Object.keys(recus.votes).map(function (k) { return recus.votes[k]; }).filter(function (p) { return p.d === d; }), props: recus.props.filter(function (p) { return p.d === d; }) })); });
  rendre();
}
