    page.querySelector('#cartes').innerHTML = '<tr><th>Recto</th><th>Verso</th><th>Oui</th><th>Bof</th><th>Non</th><th>Score</th><th></th><th>Remarques</th></tr>' + lignes().map(function (o) { var t = o.n || 1; return '<tr><td>' + ech(o.c.r) + '</td><td>' + ech(o.c.v) + '</td><td class="n">' + o.oui + '</td><td class="n">' + o.bof + '</td><td class="n">' + o.non + '</td><td class="n">' + (o.n ? (o.score > 0 ? '+' : '') + o.score.toFixed(2).replace('.', ',') : '') + '</td><td><span class="jauge"><i style="width:' + 100 * o.oui / t + '%;background:var(--vert)"></i><i style="width:' + 100 * o.bof / t + '%;background:var(--bleu)"></i><i style="width:' + 100 * o.non / t + '%;background:var(--rouge)"></i></span></td><td>' + o.rem.map(ech).join('<br>') + '</td></tr>'; }).join('');
  }
  page.querySelector('#tri').addEventListener('change', function (e) { tri = e.target.value; rendre(); });
  page.querySelector('#ajouter').addEventListener('click', function () {
    var codes = page.querySelector('#colle').value.match(/GODLJ-VOTE\.[zj]\.[A-Za-z0-9_-]+/g) || [], ok = page.querySelector('#ok'); if (!codes.length) { ok.textContent = 'Aucun code trouvé dans ce texte.'; return; }
    Promise.all(codes.map(function (c) { return decoder(c).catch(function (e) { return { erreur: e.message }; }); })).then(function (ps) {
      var bons = 0, soucis = [];
      ps.forEach(function (p) { if (p.erreur) soucis.push(p.erreur); else if (p.d !== deckId || p.h !== deck.h) soucis.push((p.n || '?') + ' : code d\'une autre version de la liste'); else { var k = norm(p.n); if (!recus[k] || recus[k].t <= p.t) recus[k] = p; bons++; } });
      ecrire(CLE, recus); page.querySelector('#colle').value = ''; ok.textContent = bons + ' envoi' + (bons > 1 ? 's' : '') + ' ajouté' + (bons > 1 ? 's' : '') + (soucis.length ? ' ; ' + soucis.join(' ; ') : '') + '.'; rendre();
    });
  });
  function copie(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { page.querySelector('#ok').textContent = 'Copié.'; }).catch(function () { prompt('Copie :', t); }); }
  page.querySelector('#tsv').addEventListener('click', function () { copie('Recto\tVerso\tOui\tBof\tNon\tScore\tRemarques\n' + lignes().map(function (o) { return [o.c.r, o.c.v, o.oui, o.bof, o.non, o.n ? o.score.toFixed(2).replace('.', ',') : '', o.rem.join(' | ')].join('\t'); }).join('\n')); });
  page.querySelector('#claude').addEventListener('click', function () { copie('=== VOTE DES CAMARADES · ' + deckId + ' · ' + deck.h + ' ===\n' + JSON.stringify({ votants: Object.keys(recus).map(function (k) { return { n: recus[k].n, t: recus[k].t, k: recus[k].k, r: recus[k].r }; }) })); });
  rendre();
}
function route() { if (location.hash === '#depouillement') depouillement(); else accueil(); }
window.addEventListener('hashchange', route); route();
</script></body></html>
